# Suppress duplicate-code (CPD) warnings for the test sources.
# The integration specs are intentionally structurally similar: every one of them drives
# the same skeleton - write a settings file and a build file, run a task with the Gradle
# TestKit, assert the task outcome and the produced files - for a different task or a
# different configuration of the same task. Keeping that skeleton visible in each spec
# makes it readable on its own, which is worth more in a test than avoiding duplication.
sonar.cpd.exclusions=src/test/**
